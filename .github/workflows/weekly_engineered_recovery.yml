name: Weekly Engineered Recovery

on:
  workflow_dispatch:

  schedule:
    - cron: '55 0 * * 1'

jobs:
  run-weekly-recovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: ./.github/actions/setup_python_env

      - name: Run weekly recovery
        uses: ./.github/actions/run_pipeline
        with:
          script: run_weekly_engineered_recovery.py
          hopsworks_api_key: ${{ secrets.HOPSWORKS_API_KEY }}