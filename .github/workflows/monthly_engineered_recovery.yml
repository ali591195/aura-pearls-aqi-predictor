name: Monthly Engineered Recovery

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0 1 * *"

jobs:
  run-monthlyy-recovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: ./.github/actions/setup_python_env

      - name: Run monthly recovery
        uses: ./.github/actions/run_pipeline
        with:
          script: run_monthly_engineered_recovery.py
          hopsworks_api_key: ${{ secrets.HOPSWORKS_API_KEY }}